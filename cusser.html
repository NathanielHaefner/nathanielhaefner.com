<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiggins Cusser</title>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400;1,600&family=Alegreya+Sans:ital,wght@0,400;0,600;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --left-bg: #fcf5c4;
            --right-bg: #ffe29e;
            --text-color: #060606;
            --button-bg: #ffffff;
            --button-text: #060606;
            --mask-start: 25%;
            --mask-end: 75%;
        }

        body, html {
            margin: 0; 
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: var(--left-bg);
        }

        .machine-container { 
            display: flex; 
            height: 100vh; 
            width: 100vw; 
        }

        .slot-window {
            flex: 1; 
            height: 100%;
            position: relative; 
            overflow: hidden;
        }

        .left-half { 
            background-color: var(--left-bg); 
        }
        .right-half { 
            background-color: var(--right-bg); 
        }

        .left-half::after,
        .right-half::after {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            z-index: 10; 
            pointer-events: none;
        }

        .left-half::after {
            background: linear-gradient(
                var(--left-bg) 0%, 
                var(--left-bg) var(--mask-start),
                transparent 45%, 
                transparent 55%, 
                var(--left-bg) var(--mask-end),
                var(--left-bg) 100%
            );
            
        }

        .right-half::after {
            background: linear-gradient(
                var(--right-bg) 0%, 
                var(--right-bg) var(--mask-start),
                transparent 45%, 
                transparent 55%, 
                var(--right-bg) var(--mask-end),
                var(--right-bg) 100%
            );
        }

        .slot-strip {
            position: absolute; 
            width: 100%; 
            left: 0; 
            top: 0;
            will-change: transform;
        }

        .word-item {
            display: flex; 
            align-items: center; 
            justify-content: left;
            width: 100%; 
            color: var(--text-color); 
            text-transform: capitalize;
            font-size: clamp(1.8rem, 10vw, 4.5rem);
            /*text-align: center; */
            box-sizing: border-box;
            line-height: 1;
        }

        .left-half .word-item {
            justify-content: right;
            padding-right: 2vw;
        }

        .right-half .word-item {
            padding-left: 2vw;
        }

        #spinBtn {
            position: fixed; 
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%); 
            z-index: 100;
            padding: 16px 40px; 
            font-size: 1.6rem;
            font-family: 'Alegreya', serif; 
            font-weight: 400;
            font-style: italic;
            background: var(--button-bg);
            color: var(--button-text);
            border: 2px solid var(--button-text);
            border-radius: 50px;
            cursor: pointer; 
            box-shadow: 0 4px 0 var(--button-text);
            transition: transform 0.1s;
        }

        #spinBtn:active { 
            transform: translateX(-50%) translateY(2px); 
            box-shadow: inset 0 4px 0 var(--button-text); 
        }
        #spinBtn:disabled { 
            opacity: .6; 
            box-shadow: inset 0 4px 0 var(--button-text); 
            cursor: not-allowed;
        }

        /* Typography Variations */
        .v-1 { font-family: 'Alegreya', serif; font-weight: 400; }
        .v-2 { font-family: 'Alegreya', serif; font-weight: 600; font-style: italic; }
        .v-3 { font-family: 'Alegreya', serif; font-weight: 800; }
        .v-4 { font-family: 'Alegreya Sans', sans-serif; font-weight: 400; font-style: italic; }
        .v-5 { font-family: 'Alegreya Sans', sans-serif; font-weight: 600; }
        .v-6 { font-family: 'Alegreya Sans', sans-serif; font-weight: 800; font-style: italic; }
    </style>
</head>
<body>

    <div class="machine-container">
        <div class="slot-window left-half"><div id="strip1" class="slot-strip"></div></div>
        <div class="slot-window right-half"><div id="strip2" class="slot-strip"></div></div>
    </div>

    <button id="spinBtn">Cuss</button>

    <script>
        const adj = ["Shit", "Fuck", "Cock", "Ass", "Dick", "Twat", "Cunt", "Piss", "Douche", "Wank", "Jerk", "Bitch", "Slut", "Whore", "Balls", "Prick", "Turd", "Chode", "Clit", "Gash", "Skank", "Anal", "Rectal", "Shaft", "Knob", "Schlong", "Bell", "Sack", "Rim", "Taint", "Nut", "Sperm", "Jizz", "Spooge", "Snot", "Puke", "Barf", "Scum", "Dirt", "Filth", "Trash", "Waste", "Sewer", "Crap", "Butt", "Arse", "Nipple", "Dong", "Boner", "Wang", "Pecker", "Wiener", "Tool", "Rod", "Tube", "Snake", "Meat", "Beef", "Neck", "Ham", "Salami", "Sausage", "Log", "Stool", "Dump", "Load", "Squirt", "Spray", "Leak", "Drip", "Ooze", "Slime", "Gunk", "Goo", "Crust", "Scab", "Pus", "Boil", "Wart", "Mole", "Fart", "Belch", "Gas", "Slobber", "Queef", "Snatch", "Crotch", "Groin", "Lap", "Rear", "Back", "Hole", "Crack", "Slot", "Pit", "Drain", "Pipe", "Hose", "Pump", "Juice", "Milk", "Cream", "Butter", "Grease", "Oil", "Fat", "Lard", "Blubber", "Flesh", "Skin", "Bone", "Brain", "Head", "Face", "Mouth", "Tongue", "Throat", "Lip", "Ear", "Eye", "Nose", "Toe", "Foot", "Hand", "Fist", "Finger", "Thumb", "Arm", "Leg", "Bolts", "Doofus", "Power", "Scuba", "Music", "Piano", "Note", "Plug", "Tofu", "Gristle", "Muck", "Stench", "Vomit", "Phlegm", "Gurgle", "Spigot", "Spout"];
        
        const noun = ["Fucker", "Sucker", "Licker", "Guzzler", "Gobbler", "Shitter", "Wanker", "Jerker", "Boner", "Donger", "Snatcher", "Twatter", "Cunter", "Pisser", "Slutter", "Whorer", "Pricker", "Herder", "Axolotl", "Choker", "Stroker", "Shafter", "Schlonger", "Tapper", "Jobber", "Sniffer", "Cruncher", "Jizzer", "Spooger", "Bagger", "Shrimp", "Wiper", "Twister", "Puller", "Swinger", "Biter", "Handler", "Rider", "Pangolin", "Steamer", "Charmer", "Beater", "Tugger", "Slapper", "Smuggler", "Jammer", "Pusher", "Taker", "Quokka", "Blower", "Gunner", "Painter", "Plugger", "Feeder", "Baller", "Stirrer", "Goblin", "Picker", "Popper", "Rubber", "Passer", "Catcher", "Rotter", "Grabber", "Dancer", "Ender", "Diver", "Filler", "Cleaner", "Squeezer", "Churner", "Slicker", "Render", "Bucket", "Nugget", "Flayer", "Crusher", "Drainer", "Sitter", "Breather", "Lasher", "Smacker", "Gouger", "Fetisher", "Pumper", "Banger", "Twiddler", "Humper", "Stacker", "Tightener", "Driver", "Turner", "Grinder", "Swisher", "Polisher", "Shiner", "Burglar", "Juggler", "Nozzle", "Pirate", "Banker", "Mopper", "Vomiter", "Dabber", "Lurker", "Peeper", "Grouper", "Trooper", "Bloater", "Mucker", "Swiller", "Gunker", "Sludger", "Pointer", "Squinter", "Bender", "Crawler", "Giggler", "Stabber", "Spanker", "Dunker", "Whinner", "Barker", "Growler", "Snorter", "Wheezer", "Tapir", "Zebra", "Turtle", "Whale", "Falcon", "Otter", "Giraffe", "Lemur"];

        const strip1 = document.getElementById('strip1');
        const strip2 = document.getElementById('strip2');
        const btn = document.getElementById('spinBtn');

        const repeats = 15;
        let isFirstLoad = true;
        let currentIdx1 = 0; 
        let currentIdx2 = 0;

        function buildStrips(includeHello = false) {
            let h1 = `<div class="word-item"></div><div class="word-item"></div>`;
            let h2 = `<div class="word-item"></div><div class="word-item"></div>`;

            if (includeHello) {
                h1 += `<div class="word-item v-2">Wiggins</div>`;
                h2 += `<div class="word-item v-2">Cusser</div>`;
            } else {
                h1 += `<div class="word-item"></div>`;
                h2 += `<div class="word-item"></div>`;
            }

            for(let i = 0; i < repeats; i++) {
                adj.forEach(w => h1 += `<div class="word-item v-${Math.floor(Math.random()*6)+1}">${w}</div>`);
                noun.forEach(w => h2 += `<div class="word-item v-${Math.floor(Math.random()*6)+1}">${w}</div>`);
            }
            strip1.innerHTML = h1; strip2.innerHTML = h2;
            updateDimensions();
        }

        function updateDimensions() {
            const h = window.innerHeight / 3;
            document.querySelectorAll('.word-item').forEach(el => el.style.height = h + 'px');
            strip1.style.transition = 'none'; strip2.style.transition = 'none';

            if (isFirstLoad) {
                strip1.style.transform = `translateY(-${h}px)`;
                strip2.style.transform = `translateY(-${h}px)`;
            } else {
                const targetSet = 10;
                const pos1 = (targetSet * adj.length + currentIdx1 + 2) * h - h;
                const pos2 = (targetSet * noun.length + currentIdx2 + 2) * h - h;
                strip1.style.transform = `translateY(-${pos1}px)`;
                strip2.style.transform = `translateY(-${pos2}px)`;
            }
        }

        function spin() {
            btn.disabled = true;
            if (isFirstLoad) { isFirstLoad = false; buildStrips(false); }

            const h = window.innerHeight / 3;
            strip1.style.transition = 'none'; strip2.style.transition = 'none';
            strip1.style.transform = `translateY(0px)`; strip2.style.transform = `translateY(0px)`;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    currentIdx1 = Math.floor(Math.random() * adj.length);
                    currentIdx2 = Math.floor(Math.random() * noun.length);
                    const targetSet = 10;
                    const pos1 = (targetSet * adj.length + currentIdx1 + 2) * h - h;
                    const pos2 = (targetSet * noun.length + currentIdx2 + 2) * h - h;

                    const smoothTiming = 'transform 3.0s cubic-bezier(0.1, 0, 0, 1)';
                    strip1.style.transition = smoothTiming;
                    strip2.style.transition = 'transform 3.2s cubic-bezier(0.1, 0, 0, 1)';

                    strip1.style.transform = `translateY(-${pos1}px)`;
                    strip2.style.transform = `translateY(-${pos2}px)`;
                });
            });
            setTimeout(() => btn.disabled = false, 3500);
        }

        buildStrips(true);
        window.addEventListener('resize', updateDimensions);
        btn.addEventListener('click', spin);
    </script>
</body>
</html>
